<!doctype html>
<html lang="en" style="background-color: #07070a">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07070a" />

    <!-- Icons (square, as Google requires for the search-result icon) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Per-page SEO tags. Filled in at build time from src/content/seo.ts
         (see vite.config.ts) — do not hand-edit titles or canonicals here. -->
    <!--seo:start-->
    <!--seo:end-->

    <!-- Site-wide social tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reazix Technology" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Brand structured data: tells Google the site name and its short form -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://reazix.com/#website",
            "url": "https://reazix.com/",
            "name": "Reazix Technology",
            "alternateName": ["Reazix", "Reazix Technologies"],
            "publisher": { "@id": "https://reazix.com/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://reazix.com/#organization",
            "name": "Reazix Technology",
            "alternateName": ["Reazix", "Reazix Technologies"],
            "url": "https://reazix.com/",
            "logo": "https://reazix.com/icon-512.png",
            "description": "Reazix Technology builds modern web applications, AI & ML solutions, mobile applications, and scalable digital solutions for businesses.",
            "email": "contact@reazix.com",
            "telephone": "+918275529298",
            "address": { "@type": "PostalAddress", "addressCountry": "IN" },
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+918275529298",
              "email": "contact@reazix.com",
              "contactType": "customer service"
            },
            "sameAs": [
              "https://www.instagram.com/reazix.technologies",
              "https://www.linkedin.com/in/reazix-technology-1657b1423/"
            ]
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
